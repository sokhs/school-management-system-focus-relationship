server:
  port: 8081

spring:
  application:
    name: school-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/school_management_system
    username: postgres
    password: 123

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
